<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ feature map</title>
<style>
:root{
  --bg:#f6f5f1;--bg2:#ecebe5;--panel:#ffffffee;--solid:#fff;--ink:#1b1b19;--muted:#6d6c66;--faint:#a9a8a1;--line:#e2e1da;
  --edge:#c9c8bf;--accent:#4c5fd5;--auto:#2e9e5b;--method:#e0a21b;--none:#e0603c;--chip:#f0efe9;--code:#f1f0ea;
  --shadow:0 1px 2px #0000000d,0 8px 24px #0000000f;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211;--bg2:#1a1a18;--panel:#1d1d1bee;--solid:#1d1d1b;--ink:#ecebe5;--muted:#9c9b94;--faint:#5f5e59;--line:#2c2c29;
  --edge:#3d3d39;--uv:.3;--accent:#8c9cff;--auto:#4fd18b;--method:#f5c043;--none:#ff8662;--chip:#262624;--code:#262623;--shadow:0 1px 2px #0006,0 10px 30px #0008
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100svh}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding:18px 20px 10px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.stat b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{display:block;color:var(--muted);font-size:11.5px}
.stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:13.5px;padding:9px 8px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
#view{position:relative;flex:1;min-height:0;overflow:auto}
.stage{position:relative;height:100%;min-height:420px;overflow:hidden;background:var(--bg2)}
.canvas{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:88px 0 70px}
svg.graph{display:block;margin:0 auto;user-select:none}
.colhead{font:600 11px -apple-system,BlinkMacSystemFont,sans-serif;fill:var(--muted);letter-spacing:.06em}
.edge{fill:none;stroke:var(--edge);transition:stroke .15s,opacity .15s}
.edge.uv{stroke-dasharray:3 4;opacity:.55}
.edge.clash{stroke:var(--none);stroke-width:1.6;stroke-dasharray:2 3;opacity:.85}
.mece{border:0;border-radius:999px;padding:6px 12px;font:600 12.5px inherit;cursor:pointer;align-self:center}
.mece.ok{background:color-mix(in srgb,var(--auto) 18%,transparent);color:var(--auto)}
.mece.bad{background:color-mix(in srgb,var(--none) 18%,transparent);color:var(--none)}
.mecehead{display:inline-block;font:700 18px inherit;padding:8px 14px;border-radius:12px;margin:6px 0}
.mecehead.ok{background:color-mix(in srgb,var(--auto) 16%,transparent);color:var(--auto)}
.mecehead.bad{background:color-mix(in srgb,var(--none) 16%,transparent);color:var(--none)}
.mrow{font:12.5px var(--mono);padding:6px 8px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .enter .node{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 18ms)}
  .enter .edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards;animation-delay:calc(160ms + var(--i,0) * 6ms)}
  .enter .edge.uv,.enter .edge.clash{animation-name:drawdash;stroke-dasharray:3 4;stroke-dashoffset:0}
  .edge.hot{stroke-dasharray:7 5!important;animation:flow .8s linear infinite!important}
  .node{transition:opacity .2s,transform .2s,filter .2s}
  .node:hover rect.box{stroke:var(--accent)}
  .drawer{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
}
@keyframes rise{from{opacity:0;translate:-10px 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drawdash{from{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.node{cursor:pointer;transition:opacity .15s}
.node rect.box{fill:var(--solid);stroke:var(--line)}
.node .t1{font:600 12px var(--mono);fill:var(--ink)}
.node .t2{font:600 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
.node .t3{font:11px -apple-system,BlinkMacSystemFont,sans-serif;fill:var(--muted)}
.leaf text{font:11.5px var(--mono);fill:var(--ink)}
.leaf text tspan.n{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
.list-uv{opacity:.45}
.uvn{opacity:var(--uv,.4);filter:grayscale(1)}
.uvn rect.box{stroke-dasharray:4 3;fill:var(--bg2)}
.uvn:hover{opacity:.75}
.dim{opacity:.08!important}
.edge.hot{stroke:var(--accent);stroke-width:2.2!important;opacity:1;stroke-dasharray:none}
.node.hotn{opacity:1;filter:none}
rect.ring,circle.ring{stroke:var(--accent);stroke-width:2.5;fill:none}
.toolbar{position:absolute;top:10px;left:12px;right:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
.search{flex:0 1 260px;min-width:150px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.chip{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.chip.off{opacity:.45}
.chip.on{border-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.zoom{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:16px/1 inherit;cursor:pointer;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;top:54px;z-index:2;display:flex;flex-wrap:wrap;gap:2px 14px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);max-width:calc(100% - 80px)}
.legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
.drawer{position:absolute;z-index:3;top:12px;right:12px;bottom:12px;width:380px;max-width:calc(100% - 24px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:auto;padding:18px 18px 22px;transform:translateX(calc(100% + 24px));transition:transform .22s ease}
.drawer.open{transform:none}
@media (max-width:760px){
  .drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;max-height:62%;transform:translateY(calc(100% + 16px))}
  .legend{right:12px;max-width:none;font-size:11px;padding:4px 9px;top:auto;bottom:12px;right:58px}
  .legend div:not(.uvkey){display:none}
  header{padding:14px 16px 8px}
  .stats{margin-left:0;gap:16px;flex-wrap:nowrap}
  .stat b{font-size:17px}
  .stat span{font-size:10.5px}
}
.close{position:absolute;top:10px;right:10px;border:0;background:var(--chip);color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px}
.kicker{font:600 11.5px var(--mono);color:var(--muted);letter-spacing:.02em}
.ename{display:flex;align-items:center;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.ename code{font:600 15.5px var(--mono);background:var(--code);padding:4px 8px;border-radius:7px;color:var(--ink)}
.copy{border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:7px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.desc{font-size:15px;line-height:1.6;margin:0 0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 10px 3px 8px;background:var(--chip)}
.why{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.box{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.box h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.proof{font-size:12px;margin:4px 0;word-break:break-all}
.proof code,.drawer code{font:11.5px var(--mono);background:var(--code);padding:1px 4px;border-radius:4px}
.mini{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.mini:first-child{border-top:0}
.mini b{font:600 12px var(--mono);white-space:nowrap}
.mini span{color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
details .orig{font-size:12.5px;color:var(--muted)}
details .orig pre{background:var(--code);padding:8px;border-radius:8px;overflow:auto}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chip);margin:8px 0 2px}
.bar i{height:100%}
.page{max-width:1100px;margin:0 auto;padding:16px 20px 40px}
table{width:100%;border-collapse:collapse}
td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top}
td.id{font:600 12px var(--mono);white-space:nowrap}
td.nm{font:12.5px var(--mono);white-space:nowrap}
.fh{margin:26px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fh b{font:600 14px var(--mono)}
.fh span{font-weight:600}
.fh small{color:var(--muted)}
.surf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.s{background:var(--solid);border:1px solid var(--line);border-left:3px solid var(--auto);border-radius:10px;padding:8px 10px;font-size:12.5px}
.s.miss{border-left-color:var(--none)}
.s b{font:600 12.5px var(--mono)}
.s div{color:var(--muted)}
.group{margin:18px 0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:760px){td.nm{white-space:normal}}
</style>
</head>
<body>
<header>
  <div><h1 id="title"></h1><div class="meta" id="meta"></div></div>
  <div class="stats" id="stats"></div>
</header>
<nav id="tabs"></nav>
<div id="view"></div>
<script>
const D = __DATA__;
const ST = {auto: "자동 검증", method: "방법만", none: "없음"};
const WHY = {auto: "실행 파일이나 실행 명령 줄이 이 ID 를 가리킨다.", method: "Driving 절에 손으로 모는 방법만 있다. 돌릴 스크립트는 없다.", none: "검증 방법이 어디에도 없다."};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const S = D.summary, pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const unmapped = D.surfaces.filter(s => !s.mapped_in.length && !("exclude" in s));
const M = D.mece || [];
const surfacesOf = key => D.surfaces.filter(s => s.mapped_in.includes(key));
const count = subs => ({auto: subs.filter(s => s.status === "auto").length, method: subs.filter(s => s.status === "method").length, none: subs.filter(s => s.status === "none").length});
const bar = c => { const t = (c.auto + c.method + c.none) || 1; return `<div class="bar">${["auto", "method", "none"].map(k => `<i style="width:${c[k] * 100 / t}%;background:var(--${k})"></i>`).join("")}</div>`; };
const state = {tab: "graph", zoom: null, sel: null, status: new Set(["auto", "method", "none"]), q: "", onlyMiss: false};

document.getElementById("title").textContent = D.title;
document.getElementById("meta").textContent = `${D.repo} · ${D.generated} · 기능 ${S.features} · 하위 기능 ${S.subs}`;
document.getElementById("stats").innerHTML = [
  [`${pct(S.auto, S.subs)}%`, `<i style="background:var(--auto)"></i>자동 검증 ${S.auto}/${S.subs}`],
  [`${pct(S.auto + S.method, S.subs)}%`, `<i style="background:var(--method)"></i>검증 방법 있음 ${S.auto + S.method}/${S.subs}`],
  [S.surfaces ? `${pct(S.mapped, S.surfaces - S.excluded)}%` : "–", S.surfaces ? `주인 있는 진입점 ${S.mapped}/${S.surfaces - S.excluded}${S.excluded ? ` · 제외 ${S.excluded}` : ""}` : "진입점 목록 없음"],
].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("") + `<button class="mece ${M.length ? "bad" : "ok"}" data-tab="mece">${M.length ? `MECE 아님 · ${M.length}` : "MECE ✓"}</button>`;
document.getElementById("stats").onclick = e => { if (e.target.closest("[data-tab]")) { state.tab = "mece"; render(); } };

const TABS = [["graph", "그래프"], ["mece", `MECE ${M.length ? "✕ " + M.length : "✓"}`], ["list", "목록"], ["surfaces", `진입점 ${S.surfaces ? S.mapped + "/" + (S.surfaces - S.excluded) : ""}`], ["gaps", `README 빈칸 ${S.gaps}`]];
const tabsEl = document.getElementById("tabs");
tabsEl.onclick = e => { const k = e.target.dataset.tab; if (k) { state.tab = k; render(); } };

const NODES = {};
D.features.forEach(f => { NODES[f.id] = {kind: "feature", f}; f.subs.forEach(s => NODES[s.id] = {kind: "sub", s, f}); });
NODES.__unmapped = {kind: "unmapped"};

function matches(s) {
  if (!state.status.has(s.status)) return false;
  const q = state.q.trim().toLowerCase();
  return !q || `${s.id} ${s.name} ${s.desc}`.toLowerCase().includes(q);
}

const GROUPS = [...new Set(D.surfaces.map(s => s.group || "기타"))].map((g, i) => ({id: "g:" + i, name: g, items: D.surfaces.filter(s => (s.group || "기타") === g)}));
GROUPS.forEach(g => NODES[g.id] = {kind: "group", g});
const verified = {sub: s => s.status === "auto", feature: f => f.subs.some(s => s.status === "auto"), group: g => g.items.some(s => s.mapped_in.some(k => verified.feature(D.features.find(f => f.key === k))))};
const cut = (t, n) => t.length > n ? t.slice(0, n - 1) + "…" : t;

function layout() {
  const narrow = innerWidth <= 760, ROW = narrow ? 28 : 30, GW = narrow ? 96 : 178, FW = narrow ? 112 : 190, GAP = narrow ? 24 : 170;
  const gx = 12, fx = gx + GW + GAP, sx = fx + FW + GAP * 0.8, W = sx + (narrow ? 118 : 330), top = 36;
  const pos = {};
  let y = top;
  const cols = [...D.features.map(f => ({id: f.id, n: Math.max(f.subs.length, 1), subs: f.subs}))];
  if (unmapped.length) cols.push({id: "__unmapped", n: 2, subs: []});
  cols.forEach(c => {
    c.subs.forEach((s, i) => pos[s.id] = {x: sx, y: y + ROW * (i + 0.5)});
    pos[c.id] = {x: fx, y: y + ROW * c.n / 2};
    y += ROW * (c.n + 0.7);
  });
  const want = g => { const ids = g.items.flatMap(s => s.mapped_in.map(k => D.features.find(f => f.key === k).id)); const use = ids.length ? ids : unmapped.length ? ["__unmapped"] : []; return use.length ? use.reduce((a, id) => a + pos[id].y, 0) / use.length : top; };
  const order = GROUPS.map(g => [g, want(g)]).sort((a, b) => a[1] - b[1]);
  const ys = [];
  order.forEach(([, w], i) => ys.push(Math.max(i ? ys[i - 1] + 54 : top + 21, w)));
  const mean = a => a.reduce((x, v) => x + v, 0) / (a.length || 1);
  const shift = Math.max(mean(order.map(o => o[1])) - mean(ys), top + 21 - (ys[0] ?? 0));
  order.forEach(([g], i) => pos[g.id] = {x: gx, y: ys[i] + shift});
  const H = Math.max(y, (ys.at(-1) ?? 0) + shift + 30) + 20;
  return {pos, W, H, GW, FW, narrow, sx};
}

function graphView() {
  const {pos, W, H, GW, FW, narrow, sx} = layout();
  if (state.zoom === null) state.zoom = innerWidth > 0 ? Math.max(0.4, Math.min(1, (innerWidth - 8) / W)) : 1;
  const link = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}`; };
  let edges = "", nodes = "";
  GROUPS.forEach(g => {
    const to = {};
    g.items.forEach(s => s.mapped_in.forEach(k => to[k] = (to[k] || 0) + 1));
    const miss = g.items.filter(s => !s.mapped_in.length && !("exclude" in s)).length;
    Object.entries(to).forEach(([k, n]) => { const f = D.features.find(x => x.key === k); edges += `<path class="edge ${verified.feature(f) ? "" : "uv"}" data-for="${g.id} ${esc(f.id)}" stroke-width="${1 + Math.log2(1 + n)}" d="${link(pos[g.id].x + GW, pos[g.id].y, pos[f.id].x, pos[f.id].y)}"/>`; });
    const clash = {};
    g.items.filter(s => s.owner_key).forEach(s => (s.claimed_in || []).filter(k => k !== s.owner_key).forEach(k => clash[k] = (clash[k] || 0) + 1));
    Object.keys(clash).forEach(k => { const f = D.features.find(x => x.key === k); edges += `<path class="edge clash" data-for="${g.id} ${esc(f.id)}" d="${link(pos[g.id].x + GW, pos[g.id].y, pos[f.id].x, pos[f.id].y + 10)}"/>`; });
    if (miss && unmapped.length) edges += `<path class="edge uv" data-for="${g.id} __unmapped" stroke-width="${1 + Math.log2(1 + miss)}" d="${link(pos[g.id].x + GW, pos[g.id].y, pos.__unmapped.x, pos.__unmapped.y)}"/>`;
  });
  D.features.forEach(f => f.subs.forEach(s => edges += `<path class="edge ${verified.sub(s) ? "" : "uv"}" data-for="${esc(f.id)} ${esc(s.id)}" stroke-width="1.3" d="${link(pos[f.id].x + FW, pos[f.id].y, pos[s.id].x - 7, pos[s.id].y)}"/>`));
  GROUPS.forEach(g => {
    const {x, y} = pos[g.id], m = g.items.filter(s => s.mapped_in.length).length, w = GW;
    nodes += `<g class="node grp ${verified.group(g) ? "" : "uvn"}" data-id="${g.id}" transform="translate(${x},${y - 21})"><rect class="ring" x="-4" y="-4" width="${w + 8}" height="50" rx="12" style="display:none"/><rect class="box" width="${w}" height="42" rx="9"/><text class="t2" x="10" y="17">${esc(cut(g.name, narrow ? 11 : 24))}</text><text class="t3" x="10" y="33">${narrow ? `${m}/${g.items.length}` : `진입점 ${g.items.length} · 주인 있음 ${m}`}</text><rect x="0" y="40" width="${w * m / g.items.length}" height="2" fill="var(--accent)"/></g>`;
  });
  D.features.forEach(f => {
    const {x, y} = pos[f.id], c = count(f.subs), t = Math.max(f.subs.length, 1);
    let bx = 0, segs = "";
    ["auto", "method", "none"].forEach(k => { const w = FW * c[k] / t; if (w) segs += `<rect x="${bx}" y="44" width="${w}" height="4" fill="var(--${k})"/>`; bx += w; });
    nodes += `<g class="node feature ${verified.feature(f) ? "" : "uvn"}" data-id="${esc(f.id)}" transform="translate(${x},${y - 24})"><rect class="ring" x="-4" y="-4" width="${FW + 8}" height="56" rx="12" style="display:none"/><rect class="box" width="${FW}" height="48" rx="9"/><text class="t1" x="10" y="17">${esc(f.id)}</text><text class="t2" x="10" y="34">${esc(cut(f.name, narrow ? 12 : 21))}</text><text class="t3" x="${FW - 10}" y="17" text-anchor="end">${c.auto}/${f.subs.length}</text><clipPath id="c-${esc(f.id)}"><rect width="${FW}" height="48" rx="9"/></clipPath><g clip-path="url(#c-${esc(f.id)})">${segs}</g></g>`;
  });
  if (unmapped.length) {
    const {x, y} = pos.__unmapped;
    nodes += `<g class="node feature uvn" data-id="__unmapped" transform="translate(${x},${y - 24})"><rect class="ring" x="-4" y="-4" width="${FW + 8}" height="56" rx="12" style="display:none"/><rect class="box" width="${FW}" height="48" rx="9"/><text class="t1" x="10" y="17" fill="var(--none)">Unowned</text><text class="t3" x="10" y="34">주인 없는 진입점 ${unmapped.length}</text></g>`;
  }
  D.features.forEach(f => f.subs.forEach(s => {
    const {x, y} = pos[s.id], dot = s.status === "auto" ? `<circle r="6.5" fill="var(--auto)"/>` : s.status === "method" ? `<circle r="5.5" fill="var(--solid)" stroke="var(--method)" stroke-width="2.5"/>` : `<circle r="5.5" fill="none" stroke="var(--none)" stroke-width="1.6" stroke-dasharray="2 2"/>`;
    nodes += `<g class="node leaf ${verified.sub(s) ? "" : "uvn"}" data-id="${esc(s.id)}" transform="translate(${x},${y})"><circle class="ring" r="11" style="display:none"/>${dot}<text x="13" dy=".35em">${esc(s.id)} <tspan class="n">${esc(cut(s.name, narrow ? 7 : 34))}</tspan></text></g>`;
  }));
  const heads = `<text class="colhead" x="12" y="14">진입점</text><text class="colhead" x="${pos[D.features[0]?.id]?.x ?? 0}" y="14">기능</text><text class="colhead" x="${sx - 6}" y="14">끝점 · 하위 기능</text>`;
  const chips = ["auto", "method", "none"].map(k => `<button class="chip ${state.status.has(k) ? "" : "off"}" data-st="${k}" title="${WHY[k]}"><span class="dot" style="background:var(--${k})"></span>${ST[k]} ${S[k]}</button>`).join("");
  return `<div class="stage">
    <div class="canvas" id="canvas"><svg class="graph" id="svg" viewBox="0 0 ${W} ${H}" width="${W * state.zoom}" height="${H * state.zoom}" data-w="${W}" data-h="${H}"><g id="world">${heads}${edges}${nodes}</g></svg></div>
    <div class="toolbar"><input class="search" id="q" type="search" placeholder="ID·영어 이름·설명으로 찾기" value="${esc(state.q)}">${chips}</div>
    <div class="legend"><div class="uvkey"><span class="dot" style="background:var(--faint);opacity:.6"></span>흐린 것 = 자동 검증 없음 (눌러 볼 수 있음)</div><div><span class="dot" style="background:var(--auto)"></span>자동 검증: 스크립트·시험이 돌린다</div><div><span class="dot" style="border:2.5px solid var(--method);box-sizing:border-box"></span>방법만: 손으로 모는 방법만 있다</div><div><span class="dot" style="border:1.6px dashed var(--none);box-sizing:border-box"></span>없음: 검증 방법이 없다</div></div>
    <div class="zoom"><button data-z="1.2" aria-label="확대">+</button><button data-z="0.83" aria-label="축소">−</button><button data-z="0" aria-label="원래 크기">⤢</button></div>
    <aside class="drawer" id="drawer"></aside>
  </div>`;
}

function drawerHtml(id) {
  const n = NODES[id];
  if (!n) return "";
  const close = `<button class="close" data-close aria-label="닫기">✕</button>`;
  const copy = text => `<button class="copy" data-copy="${esc(text)}">복사</button>`;
  if (n.kind === "group") {
    const g = n.g, fname = k => { const f = D.features.find(x => x.key === k); return f ? `${f.id} ${f.name}` : k; };
    return `${close}<div class="kicker">ENTRY POINTS</div><div class="ename"><code>${esc(g.name)}</code></div><p class="desc">이 묶음의 진입점 ${g.items.length}개 가운데 ${g.items.filter(s => s.mapped_in.length).length}개에 주인 기능이 있다. ${verified.group(g) ? "" : "이 묶음이 닿는 기능에는 자동 검증이 없다."}</p>
      <div class="box"><h4>진입점</h4>${g.items.map(s => `<div class="proof ${s.mapped_in.length ? "" : "list-uv"}"><b>${esc(s.label || s.id)}</b> ${(s.match || []).map(m => `<code>${esc(m)}</code>`).join(" ")} → ${"exclude" in s ? `제외: ${esc(s.exclude)}` : s.mapped_in.length ? s.mapped_in.map(k => `<a href="#" data-pick="${esc(D.features.find(f => f.key === k).id)}">${esc(fname(k))}</a>`).join(", ") : '<b style="color:var(--none)">주인 없음</b>'}${(s.claimed_in || []).filter(k => k !== s.owner_key).length ? ` <b style="color:var(--none)">겹침: ${s.claimed_in.filter(k => k !== s.owner_key).map(fname).map(esc).join(", ")}</b>` : ""} <span style="color:var(--muted)">${esc(s.where || "")}</span></div>`).join("")}</div>`;
  }
  if (n.kind === "unmapped") {
    return `${close}<div class="kicker">UNMAPPED</div><div class="ename"><code>Unmapped</code></div><p class="desc">주인 기능이 없는 진입점 ${unmapped.length}개다. 하나라도 있으면 지도는 MECE 가 아니다(빠짐). 그 진입점을 여는 화면·처리기를 맡은 기능 파일에 적거나, 없으면 기능 파일을 새로 만든다.</p>
      ${D.gaps.length ? `<div class="box"><h4>README 가 적어 둔 빈칸</h4><ul>${D.gaps.map(g => `<li>${g}</li>`).join("")}</ul></div>` : ""}
      <div class="box"><h4>주인 없는 진입점</h4>${unmapped.slice(0, 200).map(s => `<div class="proof"><b>${esc(s.label || s.id)}</b> ${(s.match || []).map(m => `<code>${esc(m)}</code>`).join(" ")} <span style="color:var(--muted)">${esc(s.where || "")}</span></div>`).join("")}</div>`;
  }
  if (n.kind === "feature") {
    const f = n.f, c = count(f.subs), surf = surfacesOf(f.key);
    return `${close}<div class="kicker">FEATURE · ${esc(f.file)}</div><div class="ename"><code>${esc(f.id)} ${esc(f.name)}</code>${copy(`${f.id} ${f.name}`)}</div>
      <p class="desc">${esc(f.desc) || '<span style="color:var(--muted)">한국어 설명이 없다.</span>'}</p>${bar(c)}<div class="why">자동 ${c.auto} · 방법만 ${c.method} · 없음 ${c.none}</div>
      <div class="box"><h4>하위 기능</h4>${f.subs.map(s => `<div class="mini" data-pick="${esc(s.id)}"><span class="dot" style="background:var(--${s.status})"></span><b>${esc(s.id)}</b><span><span style="font-family:var(--mono);color:var(--ink)">${esc(s.name)}</span> · ${esc(s.desc)}</span></div>`).join("")}</div>
      ${surf.length ? `<div class="box"><h4>이 기능 파일에 적힌 진입점 ${surf.length}</h4>${surf.map(s => (s.match || []).map(m => `<code>${esc(m)}</code>`).join(" ")).join(" · ")}</div>` : ""}
      <div class="box"><details><summary>원문 (${esc(f.file)})</summary><div class="orig">${f.purpose}${f.sections.map(x => `<h4>${esc(x.name)}</h4>${x.html}`).join("")}</div></details></div>`;
  }
  const s = n.s, f = n.f;
  return `${close}<div class="kicker">SUB-FEATURE · <a href="#" data-pick="${esc(f.id)}">${esc(f.id)} ${esc(f.name)}</a></div><div class="ename"><code>${esc(s.id)} ${esc(s.name)}</code>${copy(`${s.id} ${s.name}`)}</div>
    <p class="desc">${esc(s.desc) || '<span style="color:var(--muted)">한국어 설명이 없다.</span>'}</p>
    <span class="pill"><span class="dot" style="background:var(--${s.status})"></span>${ST[s.status]}</span>${s.proofs.some(p => p.named) ? '<span class="pill" style="margin-left:6px">이름 파일이 짚은 시험</span>' : ""}<div class="why">${WHY[s.status]}</div>
    ${s.proofs.length ? `<div class="box"><h4>근거</h4>${s.proofs.map(p => `<div class="proof"><code>${esc(p.path)}:${p.line}</code> ${esc(p.text)}</div>`).join("")}</div>` : ""}
    <div class="box"><details><summary>원문</summary><div class="orig">${s.html}</div></details></div>`;
}

let centerOn = () => {};
function setupGraph() {
  const svg = document.getElementById("svg"), canvas = document.getElementById("canvas"), drawer = document.getElementById("drawer");
  if (!state.introDone) {
    state.introDone = true;
    const col = el => +(el.closest(".node, .edge")?.getAttribute("transform")?.match(/\d+/)?.[0] || 0);
    svg.querySelectorAll(".node").forEach((n, i) => n.style.setProperty("--i", Math.round(col(n) / 40) + (i % 12)));
    svg.querySelectorAll(".edge").forEach((e, i) => { e.setAttribute("pathLength", "1"); e.style.setProperty("--i", i % 40); });
    svg.classList.add("enter");
    setTimeout(() => { svg.classList.remove("enter"); svg.querySelectorAll(".edge").forEach(e => e.removeAttribute("pathLength")); }, 1900);
  }
  const zoomTo = z => { const cx = (canvas.scrollLeft + canvas.clientWidth / 2) / state.zoom, cy = (canvas.scrollTop + canvas.clientHeight / 2) / state.zoom; state.zoom = Math.min(2.5, Math.max(0.4, z)); svg.setAttribute("width", svg.dataset.w * state.zoom); svg.setAttribute("height", svg.dataset.h * state.zoom); canvas.scrollLeft = cx * state.zoom - canvas.clientWidth / 2; canvas.scrollTop = cy * state.zoom - canvas.clientHeight / 2; };
  svg.addEventListener("click", e => { const g = e.target.closest(".node"); select(g ? g.dataset.id : null); });
  svg.addEventListener("mouseover", e => { const g = e.target.closest(".node"); if (g && !state.sel) focus(g.dataset.id); });
  svg.addEventListener("mouseout", e => { if (e.target.closest(".node") && !state.sel) focus(null); });
  centerOn = g => {
    const c = canvas.getBoundingClientRect(), r = g.getBoundingClientRect(), narrow = innerWidth <= 760;
    const sheetTop = c.bottom - drawer.offsetHeight - 8, panelLeft = c.right - drawer.offsetWidth - 12;
    const tx = narrow ? c.left + c.width / 2 : c.left + (panelLeft - c.left) / 2, ty = narrow ? c.top + 70 + (sheetTop - c.top - 70) / 2 : c.top + c.height / 2;
    canvas.scrollBy({left: r.left + r.width / 2 - tx, top: r.top + r.height / 2 - ty, behavior: "smooth"});
  };
  document.querySelector(".zoom").onclick = e => { const b = e.target.closest("[data-z]"); if (!b) return; const z = +b.dataset.z; zoomTo(z ? state.zoom * z : 1); };
  drawer.onclick = e => {
    const c = e.target.closest("[data-copy]"), p = e.target.closest("[data-pick]");
    if (c) { navigator.clipboard?.writeText(c.dataset.copy); c.textContent = "복사됨"; setTimeout(() => c.textContent = "복사", 1200); }
    if (p) { e.preventDefault(); select(p.dataset.pick); }
    if (e.target.closest("[data-close]")) select(null);
  };
  filter();
  if (state.sel) select(state.sel);
}

function groupsTo(fid) { const f = D.features.find(x => x.id === fid); return GROUPS.filter(g => g.items.some(s => fid === "__unmapped" ? !s.mapped_in.length : f && s.mapped_in.includes(f.key))).map(g => g.id); }
function related(id) {
  const n = NODES[id], ids = new Set([id]);
  if (n?.kind === "feature") { n.f.subs.forEach(s => ids.add(s.id)); groupsTo(n.f.id).forEach(g => ids.add(g)); }
  if (n?.kind === "sub") { ids.add(n.f.id); groupsTo(n.f.id).forEach(g => ids.add(g)); }
  if (n?.kind === "unmapped") groupsTo("__unmapped").forEach(g => ids.add(g));
  if (n?.kind === "group") n.g.items.forEach(s => s.mapped_in.length ? s.mapped_in.forEach(k => ids.add(D.features.find(f => f.key === k).id)) : ids.add("__unmapped"));
  return ids;
}

function focus(id) {
  const ids = id ? related(id) : null;
  document.querySelectorAll("#world .node").forEach(g => { g.classList.toggle("dim", !!ids && !ids.has(g.dataset.id)); g.classList.toggle("hotn", !!ids && g.dataset.id === id); });
  document.querySelectorAll("#world .edge").forEach(p => { const f = p.dataset.for.split(" "); const on = ids && f.every(x => ids.has(x)); p.classList.toggle("hot", !!on); p.classList.toggle("dim", !!ids && !on); });
  if (!id) filter();
}

function filter() {
  if (state.sel) return;
  const q = state.q.trim().toLowerCase();
  document.querySelectorAll("#world .leaf").forEach(g => g.classList.toggle("dim", !matches(NODES[g.dataset.id].s)));
  document.querySelectorAll("#world .feature").forEach(g => { const n = NODES[g.dataset.id]; g.classList.toggle("dim", !!q && n.kind === "feature" && !n.f.subs.some(matches) && !`${n.f.id} ${n.f.name} ${n.f.desc}`.toLowerCase().includes(q)); });
  document.querySelectorAll("#world .grp").forEach(g => g.classList.toggle("dim", !!q && !JSON.stringify(NODES[g.dataset.id].g).toLowerCase().includes(q)));
  document.querySelectorAll("#world .edge").forEach(p => p.classList.remove("hot", "dim"));
}

function select(id) {
  state.sel = id;
  document.querySelectorAll("#world .ring").forEach(r => r.style.display = "none");
  const drawer = document.getElementById("drawer");
  if (!id) { drawer.classList.remove("open"); focus(null); return; }
  const g = [...document.querySelectorAll("#world .node")].find(x => x.dataset.id === id);
  if (g) g.querySelector(".ring").style.display = "";
  drawer.innerHTML = drawerHtml(id); drawer.scrollTop = 0; drawer.classList.add("open");
  focus(id);
  if (g) setTimeout(() => centerOn(g), 230);
}

function listView() {
  const chips = ["auto", "method", "none"].map(k => `<button class="chip ${state.status.has(k) ? "" : "off"}" data-st="${k}"><span class="dot" style="background:var(--${k})"></span>${ST[k]} ${S[k]}</button>`).join("");
  const body = D.features.map(f => {
    const rows = f.subs.filter(matches).map(s => `<tr class="${s.status === "auto" ? "" : "list-uv"}"><td><span class="dot" style="background:var(--${s.status});display:inline-block" title="${ST[s.status]}"></span></td><td class="id">${esc(s.id)}</td><td class="nm">${esc(s.name)}</td><td>${esc(s.desc)}${s.proofs.length ? `<div class="proof" style="color:var(--muted)"><code>${esc(s.proofs[0].path)}:${s.proofs[0].line}</code></div>` : ""}</td></tr>`).join("");
    if (!rows) return "";
    const c = count(f.subs);
    return `<div class="fh"><b>${esc(f.id)}</b><span>${esc(f.name)}</span><small>${esc(f.desc)}</small></div>${bar(c)}<table>${rows}</table>`;
  }).join("");
  return `<div class="page"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="search" id="q" type="search" placeholder="ID·영어 이름·설명으로 찾기" value="${esc(state.q)}">${chips}</div>${body || '<div class="empty">조건에 맞는 하위 기능이 없다.</div>'}</div>`;
}

function surfacesView() {
  if (!D.surfaces.length) return `<div class="page empty">진입점 목록(--surfaces)을 주지 않아 지도 커버리지를 재지 않았다.</div>`;
  const q = state.q.trim().toLowerCase(), groups = {};
  D.surfaces.filter(s => (!state.onlyMiss || !s.mapped_in.length) && (!q || JSON.stringify(s).toLowerCase().includes(q))).forEach(s => (groups[s.group || "기타"] ??= []).push(s));
  const all = g => D.surfaces.filter(s => (s.group || "기타") === g);
  const fname = k => { const f = D.features.find(x => x.key === k); return f ? `${f.id} ${f.name}` : k; };
  const body = Object.entries(groups).map(([g, items]) => `<div class="group">${esc(g)} · 주인 있음 ${all(g).filter(s => s.mapped_in.length).length}/${all(g).length}</div><div class="surf">${items.map(s => `<div class="s ${s.mapped_in.length ? "" : "miss"}"><b>${esc(s.label || s.id)}</b> ${(s.match || []).map(m => `<code>${esc(m)}</code>`).join(" ")}<div>${s.mapped_in.length ? s.mapped_in.map(fname).map(esc).join(", ") : "주인 없음"}${s.where ? ` · <code>${esc(s.where)}</code>` : ""}</div></div>`).join("")}</div>`).join("");
  return `<div class="page"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="search" id="q" type="search" placeholder="진입점 찾기" value="${esc(state.q)}"><button class="chip ${state.onlyMiss ? "on" : ""}" id="miss"><span class="dot" style="background:var(--none)"></span>주인 없는 것만 ${S.surfaces - S.mapped}</button></div>${body || '<div class="empty">조건에 맞는 진입점이 없다.</div>'}</div>`;
}

function meceView() {
  const kinds = [["겹침", "ME · 한 진입점이 둘 이상의 기능에 적힘"], ["주인", "CE · 진입점의 주인이 없거나 주인 파일에 안 적힘"], ["하위 기능 ID 겹침", "ME · 같은 하위 기능 ID 가 두 파일에"], ["제외", "제외를 잘못 씀"]];
  const box = (title, items) => items.length ? `<div class="group">${title} · ${items.length}</div>${items.map(x => `<div class="mrow">${esc(x)}</div>`).join("")}` : "";
  const used = new Set();
  const body = kinds.map(([k, t]) => { const items = M.filter(x => !used.has(x) && x.includes(k)); items.forEach(x => used.add(x)); return box(t, items); }).join("");
  return `<div class="page"><div class="mecehead ${M.length ? "bad" : "ok"}">${M.length ? `MECE 아님 · 문제 ${M.length}` : "MECE ✓"}</div>
    <p class="why">진입점 ${S.surfaces} = 주인 있음 ${S.mapped} + 제외 ${S.excluded} + 주인 없음 ${S.unowned}. 주인 있는 진입점은 주인 기능 파일의 Sub-features·How to get 절에만 적혀야 한다. 하위 기능은 파일마다 따로라 서로 겹치지 않는다.</p>${body}</div>`;
}

function gapsView() {
  return `<div class="page">${D.gaps.length ? `<h3>README 가 적어 둔 빈칸</h3><ul>${D.gaps.map(g => `<li>${g}</li>`).join("")}</ul>` : `<div class="empty">README 에 「Not mapped yet」 절이 없다.</div>`}</div>`;
}

function render() {
  tabsEl.innerHTML = TABS.map(([k, l]) => `<button class="${state.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("");
  const v = document.getElementById("view");
  v.innerHTML = state.tab === "graph" ? graphView() : state.tab === "mece" ? meceView() : state.tab === "list" ? listView() : state.tab === "surfaces" ? surfacesView() : gapsView();
  if (state.tab === "graph") setupGraph();
  const q = document.getElementById("q");
  if (q) q.oninput = e => { state.q = e.target.value; if (state.tab === "graph") { select(null); filter(); } else { const pos = e.target.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); } };
}

document.getElementById("view").addEventListener("click", e => {
  const st = e.target.closest("[data-st]"), miss = e.target.closest("#miss");
  if (st) { const k = st.dataset.st; state.status.has(k) ? state.status.delete(k) : state.status.add(k); if (state.tab === "graph") { st.classList.toggle("off"); select(null); filter(); } else render(); }
  if (miss) { state.onlyMiss = !state.onlyMiss; render(); }
});
addEventListener("keydown", e => { if (e.key === "Escape" && state.sel) select(null); });
render();
</script>
</body>
</html>
