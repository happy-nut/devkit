# 분류(/dev:triage)와 재현·수정(/dev:repro-fix) 설정 예시.
# 이 파일을 고치지 말고 팩 밖(예: .claude/triage/configuration.yaml)에 복사해 채운다.
# 비밀 값은 넣지 않는다. 토큰은 클라우드 환경의 네트워크 비밀이나 셸 환경에 둔다.
schema_version: 1

automations:
  triage_name: "devkit-triage"
  reproduce_name: "devkit-repro-fix"
  # cloud-routine | desktop-task | manual
  triage_runner: "cloud-routine"
  reproduce_runner: "cloud-routine"
  # schedule-sweep | api | github-issue
  trigger: "schedule-sweep"

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  read_action: "configured-slack-read-action"
  thread_post_action: "configured-slack-thread-post-action"
  file_download_action: "configured-slack-file-download-action"
  operations_edit_action: "configured-slack-edit-action"
  prefer_connector_actions: true
  optional_bot_token_env: "TRIAGE_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false
  # 출처 채널을 손님(외부 사람)이 읽으면 true. 판정은 korean-humanizer 를 거친다
  customer_facing: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  pack_path: ".claude/automations/devkit/skills"
  pull_request_action: "configured-draft-pull-request-action"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

tracker:
  type: "linear"
  adapter: "issue-tracker-adapter-placeholder"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Slack report"
  require_compensation_action: true

routing:
  map_path: ".claude/triage/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  # /dev:verify-setup 이 만든 프로젝트 검증 스킬
  skill_name: "verify-example-app"
  feature_map_path: ".claude/skills/verify-example-app/features/"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/devkit-repro-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[triage:bug]"
  performance: "[triage:performance]"
  other: "[triage:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  # 일정 훑기 주기. 클라우드 루틴은 60분보다 짧게 못 한다
  sweep_minutes: 60
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

models:
  # 루틴 모델은 그 루틴 모델 선택기에 보이는 것만
  routine: "choose-from-the-routine-model-selector"
  # 서브에이전트는 opus, sonnet, haiku, fable 중
  triage: "opus"
  reproduce: "opus"
  code: "opus"
  media_review: "sonnet"
