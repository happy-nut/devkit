name: release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # plugin.json 의 version 이 유일한 진실의 원천이다. 거기서 바로 태그·릴리즈를 내면
      # "판은 올렸는데 릴리즈는 깜빡했다"가 구조적으로 일어날 수 없다(사람이나 에이전트가
      # 기억해야 하는 수동 단계가 없다). 이미 있는 판이면 조용히 건너뛴다.
      - run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 릴리즈가 이미 있다. 건너뜀."
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
